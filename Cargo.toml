[package]
name = "financial-tracker"
version = "0.1.0"
edition = "2021"
description = "Personal finance tracker: Itaú OFX statements, an event log in DuckDB, local AI categorization"
publish = false

[[bin]]
name = "finance"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
# Links the prebuilt libduckdb (DuckDB 1.5.6, see Dockerfile) instead of compiling it.
# duckdb-rs 1.MAJOR_MINOR_PATCH.x: keep this and DUCKDB_VERSION in the Dockerfile in step.
duckdb = "=1.10506.1"
encoding_rs = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["json"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
