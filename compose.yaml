# ./start.sh (or docker compose up -d), then open http://localhost:8080
# CLI: ./finance import data/inbox, ./finance summary (runs `docker compose run --rm app ...`)
# docker compose run --rm dev cargo test            (development, incremental builds)
# docker compose run --rm dev cargo run -- import data/inbox
services:
  ollama:
    image: ollama/ollama:0.5.4
    volumes:
      - ollama-models:/root/.ollama   # models survive restarts
    # no ports published: only the app containers can reach it
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      target: app
    depends_on:
      ollama:
        condition: service_healthy
    environment: &env
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
      FINANCE_DATA_DIR: /app/data
      FINANCE_RULES: /app/rules.toml
      FINANCE_PARSERS: /app/parsers.toml
    volumes: &app-volumes
      - ./data:/app/data              # statements and the DuckDB file, never committed
      - ./rules.toml:/app/rules.toml  # edit rules without rebuilding
      - ./parsers.toml:/app/parsers.toml
    profiles: [cli]                   # only for `docker compose run app ...`, not `up`

  # The web page. Published on this PC only (127.0.0.1), not on the network.
  web:
    build:
      context: .
      target: app
    command: ["serve"]
    depends_on:
      ollama:
        condition: service_healthy
    environment: *env
    volumes: *app-volumes
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  dev:
    build:
      context: .
      target: dev
    depends_on:
      ollama:
        condition: service_healthy
    environment: *env
    volumes:
      - .:/app                                # the source, edited on the host
      - cargo-registry:/usr/local/cargo/registry
      - dev-target:/app/target                # incremental debug builds survive between runs
    profiles: [dev]

volumes:
  ollama-models:
  cargo-registry:
  dev-target:
