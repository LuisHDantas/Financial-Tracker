# docker compose run --rm app import data/inbox
# docker compose run --rm app summary
services:
  ollama:
    image: ollama/ollama:0.5.4
    volumes:
      - ollama-models:/root/.ollama   # models survive restarts
    # no ports published: only the app container can reach it

  app:
    build: .
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
      FINANCE_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data              # statements and the DuckDB file, never committed
      - ./rules.toml:/app/rules.toml  # edit rules without rebuilding

volumes:
  ollama-models:
