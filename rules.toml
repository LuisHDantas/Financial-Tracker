# Categories the AI is allowed to pick from. Rename or add freely.
categories = [
  "Income", "Housing", "Groceries", "Restaurants", "Delivery",
  "Transport", "Health", "Education", "Shopping", "Subscriptions",
  "Utilities", "Travel", "Leisure", "Fees",
  "Investments", "Transfers", "Other",
]

# What each category means, in one line. The AI sees these with every question.
[meanings]
Income = "salary, payment for work, reimbursements from an employer"
Housing = "rent, condominium fees, IPTU, real estate agencies"
Groceries = "supermarkets, bakeries, markets, produce, butchers"
Restaurants = "restaurants, bars, cafés, snack bars, fast food, ice cream: eating out"
Delivery = "food delivery apps"
Transport = "ride apps, taxis, fuel, parking, tolls, car repair, car insurance, public transport"
Health = "pharmacies, doctors, dentists, labs, hospitals, health insurance, therapy"
Education = "schools, universities, courses, language schools"
Shopping = "stores, clothes, sports gear, electronics, books, pet shops, home goods, online marketplaces"
Subscriptions = "streaming, software and app subscriptions, monthly digital services"
Utilities = "electricity, water, gas, internet, phone bills"
Travel = "flights, hotels, inns, car rental, bus tickets, travel agencies"
Leisure = "cinema, theater, shows, tickets, games, parks"
Fees = "only fees and interest charged by the bank itself: package fees, IOF, overdraft interest"
Investments = "investing, brokerages, pension plans, savings and investment yields"
Transfers = "only paying your own credit card bill or moving money between your own accounts"
Other = "Pix to other people, cash withdrawals, anything that fits nothing else"

# Rules run first, top to bottom; the first match wins. Patterns are regular
# expressions matched against the statement description, case-insensitive.
# When the AI gets something wrong, add a rule here and run `recategorize`.
#
# Every rule must point to a category from the list above. Itaú descriptions are
# uppercase, often truncated and without accents. Short tokens use \b (a word
# boundary, written "\\b" inside the quotes) so they don't match inside other
# words. Anything without a rule (Pix/TED to other people, boletos, withdrawals)
# goes to the AI, which also gets the [[examples]] at the end of this file.
#
# "Transfers" is money moved between your own accounts, including paying the card
# bill. The summary leaves it out of income and spending; card purchases are counted
# one by one when you import the card statement.

# Moving money between your own accounts. First, so "TRANSF CC PARA POUPANCA"
# isn't taken for an investment.
[[rules]]
pattern = "MESMA TITULAR|CONTA PROPRIA|PARA POUPANCA"
category = "Transfers"

[[rules]]
pattern = "SALARIO|REMUNERACAO|PROVENTOS|\\bFERIAS\\b|\\bINSS\\b|REEMBOLSO|HONORARIOS"
category = "Income"

# Before Fees, so "JUROS POUPANCA" (interest you earn) isn't taken for a bank charge.
[[rules]]
pattern = "REND PAGO APLIC|RENDIMENTO|APLIC AUT|APLICACAO|RES APLIC|RESGATE|\\bCDB\\b|\\bLCI\\b|\\bLCA\\b|TESOURO|POUPANCA|PREVIDENCIA|CORRETORA|\\bDTVM\\b|INVEST"
category = "Investments"

[[rules]]
pattern = "^TAR\\b|TARIFA|\\bIOF\\b|JUROS|\\bMORA\\b|ENCARGOS|ANUIDADE|CESTA DE SERVICOS|TAXA SAQUE|MANUTENCAO CONTA"
category = "Fees"

# Cash withdrawals. After Fees, so "TAXA SAQUE" stays a fee.
[[rules]]
pattern = "SAQUE"
category = "Other"

# Paying the card bill from checking, and the matching credit on the card statement.
[[rules]]
pattern = "FATURA|ITAU CARTAO|ITAUCARD|PAG FAT|PAGAMENTO EFETUADO"
category = "Transfers"

# Before Restaurants and Transport, so "IFOOD *RESTAURANTE" and "UBER EATS" land here.
[[rules]]
pattern = "IFOOD|\\bIFD\\b|RAPPI|DELIVERY|AIQFOME|UBER ?EATS|99 ?FOOD"
category = "Delivery"

# Before Shopping, so "AMAZON PRIME" lands here and plain "AMAZON" in Shopping.
[[rules]]
pattern = "NETFLIX|SPOTIFY|DISNEY|PRIME VIDEO|AMAZON ?PRIME|\\bHBO|\\bMAX\\b|YOUTUBE|APPLE\\.COM|GOOGLE ONE|DEEZER|GLOBOPLAY|PARAMOUNT|XBOX|GAME PASS|ADOBE|CANVA|DROPBOX"
category = "Subscriptions"

[[rules]]
pattern = "UBER|\\b99 ?(APP|POP|TAXI)\\b|\\bMETRO\\b|SPTRANS|BILHETE UNICO|ESTACIONAMENTO|ESTAPAR|ZONA AZUL|SEM PARAR|CONECTCAR|VELOE|PEDAGIO|POSTO|\\bSHELL\\b|IPIRANGA|PETROBRAS|BR MANIA|CABIFY|\\bTAXI|OFICINA|AUTO ?PECAS|DETRAN|SEGURO AUTO"
category = "Transport"

[[rules]]
pattern = "DROGA|\\bRAIA\\b|PAGUE MENOS|FARMA|UNIMED|\\bAMIL\\b|HAPVIDA|LABORATORIO|HOSPITAL|CLINICA|MEDICINA|ODONTO|PSICOLOG|DENTIST|NUTRICION|OTICA"
category = "Health"

# Before Groceries, so "MERCADO LIVRE" and "MERCADOPAGO" aren't caught by "MERCADO".
[[rules]]
pattern = "MERCADO ?LIVRE|MERCADO ?PAGO|AMAZON|SHOPEE|ALIEXPRESS|MAGALU|MAGAZINE LUIZA|AMERICANAS|SHEIN|RENNER|RIACHUELO|CASAS BAHIA|TOK ?STOK|LEROY MERLIN|DECATHLON|KABUM|\\bPETZ\\b|PET ?SHOP"
category = "Shopping"

[[rules]]
pattern = "CARREFOUR|PAO DE ACUCAR|ASSAI|ATACADAO|\\bEXTRA\\b|SUPERMERC|HIPERMERC|MERCADO|MERCADINHO|HORTIFRUTI|SACOLAO|QUITANDA|PADARIA|ACOUGUE"
category = "Groceries"

[[rules]]
pattern = "RESTAURANTE|LANCHONETE|PIZZARIA|CHURRASCARIA|MC ?DONALDS|BURGER KING|STARBUCKS|OUTBACK|HAMBURG|SORVET|\\bACAI\\b|\\bBAR\\b|\\bCAFE\\b|CANTINA|ESPETINHO|HABIBS"
category = "Restaurants"

[[rules]]
pattern = "ENEL|\\bLIGHT\\b|ELETROPAULO|CEMIG|COPEL|SABESP|CEDAE|COPASA|COMGAS|GAS NATURAL|ULTRAGAZ|NATURGY|\\bVIVO\\b|\\bCLARO\\b|\\bTIM\\b|\\bOI\\b|\\bNET\\b|TELECOM"
category = "Utilities"

[[rules]]
pattern = "ALUGUEL|CONDOMIN|IPTU|QUINTOANDAR|IMOBILIARIA|\\bLOFT\\b"
category = "Housing"

[[rules]]
pattern = "LATAM|GOL LINHAS|AZUL LINHAS|VOEAZUL|AIRBNB|BOOKING|HOTEL|HOTEIS|DECOLAR|MILHAS|BUSER|UNIDAS"
category = "Travel"

[[rules]]
pattern = "ESCOLA|COLEGIO|FACULDADE|UNIVERSIDADE|UDEMY|ALURA|COURSERA|MENSALIDADE|CURSO|CURSINHO|SENAC|CULTURA INGLESA"
category = "Education"

[[rules]]
pattern = "CINEMA|CINEMARK|INGRESSO|SYMPLA|STEAM|TEATRO|PLAYSTATION|EVENTIM|BETO CARRERO"
category = "Leisure"

# Examples shown to the AI with every question, so it sees what each category
# means for Itaú descriptions. They are not rules: nothing matches them directly.
# Add one when the AI keeps getting a kind of transaction wrong and a rule
# doesn't fit (e.g. different merchants of the same kind).

[[examples]]
description = "TED PARA CONTA PROPRIA NUBANK"
category = "Transfers"

