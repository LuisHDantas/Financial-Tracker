# Categories the AI is allowed to pick from. Rename or add freely.
categories = [
  "Income", "Housing", "Groceries", "Restaurants", "Delivery",
  "Transport", "Health", "Education", "Shopping", "Subscriptions",
  "Utilities", "Travel", "Leisure", "Fees",
  "Investments", "Transfers", "Other",
]

# Rules run first, top to bottom; the first match wins. Patterns are regular
# expressions matched against the statement description, case-insensitive.
# When the AI gets something wrong, add a rule here and run `recategorize`.
#
# Every rule must point to a category from the list above. Itaú descriptions are
# uppercase, often truncated and without accents. Short tokens use \b (word
# boundary, written "\\b" inside the quotes) so they don't match inside other words. Anything without a rule
# (Pix/TED to other people, boletos, withdrawals) goes to the AI.
#
# "Transfers" is money moved between your own accounts, including paying the card
# bill. The summary leaves it out of income and spending; card purchases are counted
# one by one when you import the card statement.

[[rules]]
pattern = "SALARIO|REMUNERACAO|PROVENTOS|\\bFERIAS\\b|\\bINSS\\b"
category = "Income"

[[rules]]
pattern = "REND PAGO APLIC|RENDIMENTO|APLIC AUT|APLICACAO|RES APLIC|RESGATE|\\bCDB\\b|\\bLCI\\b|\\bLCA\\b|TESOURO"
category = "Investments"

[[rules]]
pattern = "^TAR\\b|TARIFA|\\bIOF\\b|JUROS|\\bMORA\\b|ENCARGOS|ANUIDADE"
category = "Fees"

# Paying the card bill from checking, and the matching credit on the card statement.
[[rules]]
pattern = "FATURA|ITAU CARTAO|ITAUCARD|PAG FAT|PAGAMENTO EFETUADO"
category = "Transfers"

# Before Restaurants and Transport, so "IFOOD *RESTAURANTE" and "UBER EATS" land here.
[[rules]]
pattern = "IFOOD|\\bIFD\\b|RAPPI|ZE DELIVERY|AIQFOME|UBER ?EATS"
category = "Delivery"

# Before Shopping, so "AMAZON PRIME" lands here and plain "AMAZON" in Shopping.
[[rules]]
pattern = "NETFLIX|SPOTIFY|DISNEY|PRIME VIDEO|AMAZON ?PRIME|\\bHBO|\\bMAX\\b|YOUTUBE|APPLE\\.COM|GOOGLE ONE|DEEZER|GLOBOPLAY|PARAMOUNT"
category = "Subscriptions"

[[rules]]
pattern = "UBER|\\b99 ?(APP|POP|TAXI)\\b|\\bMETRO\\b|SPTRANS|BILHETE UNICO|ESTACIONAMENTO|SEM PARAR|CONECTCAR|VELOE|POSTO|\\bSHELL\\b|IPIRANGA|PETROBRAS|BR MANIA"
category = "Transport"

[[rules]]
pattern = "DROGA|\\bRAIA\\b|PAGUE MENOS|FARMACIA|UNIMED|\\bAMIL\\b|HAPVIDA|LABORATORIO|HOSPITAL|CLINICA"
category = "Health"

# Before Groceries, so "MERCADO LIVRE" isn't caught by "MERCADO".
[[rules]]
pattern = "MERCADO ?LIVRE|AMAZON|SHOPEE|ALIEXPRESS|MAGALU|MAGAZINE LUIZA|AMERICANAS|SHEIN|RENNER|RIACHUELO"
category = "Shopping"

[[rules]]
pattern = "CARREFOUR|PAO DE ACUCAR|ASSAI|ATACADAO|\\bEXTRA\\b|SUPERMERC|MERCADO|HORTIFRUTI|PADARIA|ACOUGUE"
category = "Groceries"

[[rules]]
pattern = "RESTAURANTE|LANCHONETE|PIZZARIA|CHURRASCARIA|MC ?DONALDS|BURGER KING|STARBUCKS|OUTBACK"
category = "Restaurants"

[[rules]]
pattern = "ENEL|\\bLIGHT\\b|CEMIG|COPEL|SABESP|COMGAS|NATURGY|\\bVIVO\\b|\\bCLARO\\b|\\bTIM\\b|\\bOI\\b"
category = "Utilities"

[[rules]]
pattern = "ALUGUEL|CONDOMINIO|IPTU|QUINTOANDAR"
category = "Housing"

[[rules]]
pattern = "LATAM|GOL LINHAS|AZUL LINHAS|VOEAZUL|AIRBNB|BOOKING|HOTEL|DECOLAR"
category = "Travel"

[[rules]]
pattern = "ESCOLA|COLEGIO|FACULDADE|UNIVERSIDADE|UDEMY|ALURA|COURSERA"
category = "Education"

[[rules]]
pattern = "CINEMA|CINEMARK|INGRESSO|SYMPLA|STEAM"
category = "Leisure"
